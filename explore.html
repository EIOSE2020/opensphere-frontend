<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer - OpenSphere</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo"><i class="fas fa-globe"></i><span>OpenSphere</span></a>
            </div>
            <div class="nav-center">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Rechercher..." id="searchInput" />
                </div>
            </div>
            <div class="nav-right">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i></a>
                <a href="explore.html" class="nav-link active"><i class="fas fa-compass"></i></a>
                <a href="communities.html" class="nav-link"><i class="fas fa-users"></i></a>
                <a href="notifications.html" class="nav-link"><i class="fas fa-bell"></i></a>
                <a href="messages.html" class="nav-link"><i class="fas fa-envelope"></i></a>
                <button class="btn-post" id="openPostModal"><i class="fas fa-plus"></i><span>Poster</span></button>
                <div class="profile-avatar" onclick="window.location.href='profile.html'">
                    <img id="navAvatar" src="https://i.pravatar.cc/40?img=11" alt="Profile" />
                </div>
                <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>
    <main class="main-content">
        <div class="container" style="max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center;">
            <i class="fas fa-compass" style="font-size: 64px; color: var(--purple-primary); margin-bottom: 20px;"></i>
            <h1 style="font-size: 28px; margin-bottom: 12px;">Explorer</h1>
            <p style="color: var(--text-muted);">Découvrez les tendances, les communautés et les créateurs.</p>
            <p style="color: var(--text-muted); margin-top: 8px;">Fonctionnalité disponible bientôt !</p>
            <a href="index.html" class="btn-primary" style="display: inline-block; margin-top: 24px; text-decoration: none;">Retour au feed</a>
        </div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/web3.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
