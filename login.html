<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - OpenSphere</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 20px;
            background-image: radial-gradient(circle at 20% 50%, rgba(124,58,237,0.1) 0%, transparent 50%),
                              radial-gradient(circle at 80% 50%, rgba(236,72,153,0.1) 0%, transparent 50%);
        }
        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-glow);
        }
        .login-logo {
            font-size: 36px;
            font-weight: 900;
            background: var(--purple-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .login-logo i {
            -webkit-text-fill-color: initial;
            color: var(--purple-primary);
        }
        .login-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            margin-bottom: 10px;
        }
        .login-btn:hover {
            background: var(--bg-hover);
            border-color: var(--purple-primary);
            transform: translateY(-2px);
        }
        .login-btn.primary {
            background: var(--purple-gradient);
            border-color: transparent;
            color: white;
        }
        .login-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        .login-btn i {
            font-size: 18px;
        }
        .login-form {
            text-align: left;
            margin: 16px 0;
        }
        .login-form.hidden {
            display: none;
        }
        .login-form label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .login-form input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 12px;
            transition: var(--transition);
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--purple-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .login-form input::placeholder {
            color: var(--text-muted);
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .login-features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .login-feature {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .login-feature:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
        }
        .login-feature i {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
            color: var(--purple-primary);
        }
        .gasless-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--green-success);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 12px;
        }
        .login-footer {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .login-footer a {
            color: var(--purple-light);
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .wallet-connect-animation {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            margin-top: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--purple-primary);
        }
        .wallet-connect-animation.active {
            display: flex;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--purple-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .toggle-form-btn {
            background: none;
            border: none;
            color: var(--purple-light);
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .toggle-form-btn:hover {
            background: rgba(124, 58, 237, 0.1);
            text-decoration: underline;
        }
        .form-error {
            color: var(--red-danger);
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .form-error.show {
            display: block;
        }
        .form-success {
            color: var(--green-success);
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .form-success.show {
            display: block;
        }
        .register-link {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .register-link a {
            color: var(--purple-light);
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <i class="fas fa-globe"></i> OpenSphere
            </div>
            <p class="login-subtitle">Le réseau social souverain et décentralisé</p>

            <!-- ===== BOUTON WALLET ===== -->
            <button class="login-btn primary" id="connectWalletBtn">
                <i class="fas fa-wallet"></i> Connecter avec Wallet
            </button>

            <div class="wallet-connect-animation" id="walletAnimation">
                <div class="spinner"></div>
                <span>Connexion en cours...</span>
            </div>

            <!-- ===== BOUTON GOOGLE ===== -->
            <button class="login-btn" id="googleBtn">
                <i class="fab fa-google"></i> Continuer avec Google
            </button>

            <div class="login-divider">ou</div>

            <!-- ===== BOUTON EMAIL ===== -->
            <button class="login-btn" id="emailToggleBtn">
                <i class="fas fa-envelope"></i> Continuer avec Email
            </button>

            <!-- ===== FORMULAIRE EMAIL ===== -->
            <div class="login-form hidden" id="emailForm">
                <div style="display: flex; gap: 8px; margin-bottom: 4px;">
                    <button class="login-btn" id="loginTab" style="flex:1; padding: 8px; font-size: 13px; margin: 0;">Connexion</button>
                    <button class="login-btn" id="registerTab" style="flex:1; padding: 8px; font-size: 13px; margin: 0;">Inscription</button>
                </div>

                <!-- Formulaire de connexion -->
                <div id="loginFormContent">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="votre@email.com" value="test@test.com" />
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="Votre mot de passe" value="Password123" />
                    <div class="form-error" id="loginError"></div>
                    <div class="form-success" id="loginSuccess"></div>
                    <button class="login-btn primary" id="loginSubmitBtn">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                </div>

                <!-- Formulaire d'inscription -->
                <div id="registerFormContent" style="display: none;">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="registerUsername" placeholder="monpseudo" value="testuser" />
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="votre@email.com" value="test@test.com" />
                    <label>Mot de passe</label>
                    <input type="password" id="registerPassword" placeholder="Mot de passe (min 6 caractères)" value="Password123" />
                    <label>Nom d'affichage</label>
                    <input type="text" id="registerDisplayName" placeholder="Votre nom" value="Test User" />
                    <div class="form-error" id="registerError"></div>
                    <div class="form-success" id="registerSuccess"></div>
                    <button class="login-btn primary" id="registerSubmitBtn">
                        <i class="fas fa-user-plus"></i> S'inscrire
                    </button>
                </div>
            </div>

            <!-- ===== QR CODE ===== -->
            <button class="login-btn" id="qrBtn">
                <i class="fas fa-qrcode"></i> Scanner un QR Code
            </button>

            <div class="gasless-badge">
                <i class="fas fa-bolt"></i> Transactions sans gaz incluses
            </div>

            <div class="login-features">
                <div class="login-feature">
                    <i class="fas fa-shield-alt"></i>
                    Souveraineté
                </div>
                <div class="login-feature">
                    <i class="fas fa-gem"></i>
                    Tokenomique
                </div>
                <div class="login-feature">
                    <i class="fas fa-globe"></i>
                    Interopérable
                </div>
            </div>

            <div class="login-footer">
                En continuant, vous acceptez les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a>.
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const API_URL = 'https://opensphere-backend-0f92255e67dd.herokuapp.com/api';

            // ===== ÉLÉMENTS =====
            const connectWalletBtn = document.getElementById('connectWalletBtn');
            const walletAnimation = document.getElementById('walletAnimation');
            const googleBtn = document.getElementById('googleBtn');
            const qrBtn = document.getElementById('qrBtn');
            const emailToggleBtn = document.getElementById('emailToggleBtn');
            const emailForm = document.getElementById('emailForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginFormContent = document.getElementById('loginFormContent');
            const registerFormContent = document.getElementById('registerFormContent');
            const loginSubmitBtn = document.getElementById('loginSubmitBtn');
            const registerSubmitBtn = document.getElementById('registerSubmitBtn');
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const registerUsername = document.getElementById('registerUsername');
            const registerEmail = document.getElementById('registerEmail');
            const registerPassword = document.getElementById('registerPassword');
            const registerDisplayName = document.getElementById('registerDisplayName');
            const loginError = document.getElementById('loginError');
            const loginSuccess = document.getElementById('loginSuccess');
            const registerError = document.getElementById('registerError');
            const registerSuccess = document.getElementById('registerSuccess');

            // ===== BASCLER LE FORMULAIRE EMAIL =====
            let emailFormVisible = false;
            emailToggleBtn.addEventListener('click', function() {
                emailFormVisible = !emailFormVisible;
                emailForm.classList.toggle('hidden', !emailFormVisible);
                if (emailFormVisible) {
                    emailToggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Masquer le formulaire';
                } else {
                    emailToggleBtn.innerHTML = '<i class="fas fa-envelope"></i> Continuer avec Email';
                }
            });

            // ===== BASCLER CONNEXION / INSCRIPTION =====
            loginTab.addEventListener('click', function() {
                loginFormContent.style.display = 'block';
                registerFormContent.style.display = 'none';
                loginTab.style.background = 'var(--purple-gradient)';
                loginTab.style.color = 'white';
                registerTab.style.background = 'var(--bg-secondary)';
                registerTab.style.color = 'var(--text-secondary)';
                loginError.classList.remove('show');
                loginSuccess.classList.remove('show');
            });

            registerTab.addEventListener('click', function() {
                loginFormContent.style.display = 'none';
                registerFormContent.style.display = 'block';
                registerTab.style.background = 'var(--purple-gradient)';
                registerTab.style.color = 'white';
                loginTab.style.background = 'var(--bg-secondary)';
                loginTab.style.color = 'var(--text-secondary)';
                registerError.classList.remove('show');
                registerSuccess.classList.remove('show');
            });

            // ===== CONNEXION =====
            loginSubmitBtn.addEventListener('click', async function() {
                const email = loginEmail.value.trim();
                const password = loginPassword.value.trim();

                if (!email || !password) {
                    loginError.textContent = 'Veuillez remplir tous les champs';
                    loginError.classList.add('show');
                    return;
                }

                loginError.classList.remove('show');
                loginSuccess.classList.remove('show');
                loginSubmitBtn.disabled = true;
                loginSubmitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        loginSuccess.textContent = '✅ Connecté avec succès ! Redirection...';
                        loginSuccess.classList.add('show');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 500);
                    } else {
                        loginError.textContent = '❌ ' + data.error;
                        loginError.classList.add('show');
                        loginSubmitBtn.disabled = false;
                        loginSubmitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                    }
                } catch (error) {
                    loginError.textContent = '❌ Erreur de connexion au serveur';
                    loginError.classList.add('show');
                    loginSubmitBtn.disabled = false;
                    loginSubmitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                }
            });

            // ===== INSCRIPTION =====
            registerSubmitBtn.addEventListener('click', async function() {
                const username = registerUsername.value.trim();
                const email = registerEmail.value.trim();
                const password = registerPassword.value.trim();
                const displayName = registerDisplayName.value.trim() || username;

                if (!username || !email || !password) {
                    registerError.textContent = 'Veuillez remplir tous les champs';
                    registerError.classList.add('show');
                    return;
                }

                if (password.length < 6) {
                    registerError.textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                    registerError.classList.add('show');
                    return;
                }

                registerError.classList.remove('show');
                registerSuccess.classList.remove('show');
                registerSubmitBtn.disabled = true;
                registerSubmitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Inscription...';

                try {
                    const response = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, username, password, displayName })
                    });
                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        registerSuccess.textContent = '✅ Inscription réussie ! Redirection...';
                        registerSuccess.classList.add('show');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 500);
                    } else {
                        registerError.textContent = '❌ ' + data.error;
                        registerError.classList.add('show');
                        registerSubmitBtn.disabled = false;
                        registerSubmitBtn.innerHTML = '<i class="fas fa-user-plus"></i> S\'inscrire';
                    }
                } catch (error) {
                    registerError.textContent = '❌ Erreur de connexion au serveur';
                    registerError.classList.add('show');
                    registerSubmitBtn.disabled = false;
                    registerSubmitBtn.innerHTML = '<i class="fas fa-user-plus"></i> S\'inscrire';
                }
            });

            // ===== WALLET =====
            connectWalletBtn.addEventListener('click', function() {
                walletAnimation.classList.add('active');
                connectWalletBtn.disabled = true;

                setTimeout(() => {
                    const user = {
                        id: 'user_' + Date.now(),
                        name: 'Utilisateur Web3',
                        username: 'user_' + Math.random().toString(36).slice(2, 8),
                        wallet: '0x' + Array.from({ length: 40 }, () =>
                            Math.floor(Math.random() * 16).toString(16)
                        ).join(''),
                        avatar: 'https://i.pravatar.cc/80?img=' + Math.floor(Math.random() * 70),
                        verified: Math.random() > 0.7,
                        sphereBalance: (Math.random() * 10).toFixed(2),
                    };

                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('authToken', 'simulated_token_' + Date.now());

                    showToast(`✅ Connecté avec succès ! Bienvenue ${user.name}`, 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }, 1500);
            });

            // ===== GOOGLE =====
            googleBtn.addEventListener('click', function() {
                showToast('🔐 Connexion Google bientôt disponible', 'info');
            });

            // ===== QR CODE =====
            qrBtn.addEventListener('click', function() {
                showToast('📱 QR Code bientôt disponible', 'info');
            });

            // ===== ENTER POUR SOUMETTRE =====
            loginPassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') loginSubmitBtn.click();
            });
            registerPassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') registerSubmitBtn.click();
            });

            // ===== VÉRIFIER SI DÉJÀ CONNECTÉ =====
            const user = localStorage.getItem('user');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    if (userData.id) {
                        window.location.href = 'index.html';
                    }
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
