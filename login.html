<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - OpenSphere</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 20px;
            background-image: radial-gradient(circle at 20% 50%, rgba(124,58,237,0.1) 0%, transparent 50%),
                              radial-gradient(circle at 80% 50%, rgba(236,72,153,0.1) 0%, transparent 50%);
        }
        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-glow);
        }
        .login-logo {
            font-size: 40px;
            font-weight: 900;
            background: var(--purple-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .login-logo i {
            -webkit-text-fill-color: initial;
            color: var(--purple-primary);
        }
        .login-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: inherit;
            margin-bottom: 12px;
        }
        .login-btn:hover {
            background: var(--bg-hover);
            border-color: var(--purple-primary);
            transform: translateY(-2px);
        }
        .login-btn.primary {
            background: var(--purple-gradient);
            border-color: transparent;
            color: white;
        }
        .login-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        .login-btn i {
            font-size: 20px;
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .login-features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }
        .login-feature {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .login-feature:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
        }
        .login-feature i {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
            color: var(--purple-primary);
        }
        .gasless-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--green-success);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 16px;
        }
        .login-footer {
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .login-footer a {
            color: var(--purple-light);
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .wallet-connect-animation {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            margin-top: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--purple-primary);
        }
        .wallet-connect-animation.active {
            display: flex;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--purple-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <i class="fas fa-globe"></i> OpenSphere
            </div>
            <p class="login-subtitle">Le réseau social souverain et décentralisé</p>
            
            <button class="login-btn primary" id="connectWalletBtn">
                <i class="fas fa-wallet"></i> Connecter avec Wallet
            </button>
            
            <button class="login-btn" id="googleBtn">
                <i class="fab fa-google"></i> Continuer avec Google
            </button>
            
            <button class="login-btn" id="emailBtn">
                <i class="fas fa-envelope"></i> Continuer avec Email
            </button>
            
            <div class="wallet-connect-animation" id="walletAnimation">
                <div class="spinner"></div>
                <span>Connexion en cours...</span>
            </div>
            
            <div class="login-divider">ou</div>
            
            <button class="login-btn" id="qrBtn">
                <i class="fas fa-qrcode"></i> Scanner un QR Code
            </button>
            
            <div class="gasless-badge">
                <i class="fas fa-bolt"></i> Transactions sans gaz incluses
            </div>
            
            <div class="login-features">
                <div class="login-feature">
                    <i class="fas fa-shield-alt"></i>
                    Souveraineté
                </div>
                <div class="login-feature">
                    <i class="fas fa-gem"></i>
                    Tokenomique
                </div>
                <div class="login-feature">
                    <i class="fas fa-globe"></i>
                    Interopérable
                </div>
            </div>
            
            <div class="login-footer">
                En continuant, vous acceptez les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a>.
            </div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ===== REDIRECTION AUTOMATIQUE SUPPRIMÉE =====
            // La page de connexion reste affichée même si un utilisateur est dans localStorage
            // L'utilisateur doit cliquer sur un bouton pour se connecter
            
            // const user = localStorage.getItem('user');
            // if (user) {
            //     window.location.href = 'index.html';
            //     return;
            // }

            const connectBtn = document.getElementById('connectWalletBtn');
            const walletAnimation = document.getElementById('walletAnimation');
            
            function handleLogin(method) {
                walletAnimation.classList.add('active');
                connectBtn.disabled = true;
                
                setTimeout(() => {
                    const user = {
                        id: 'user_' + Date.now(),
                        name: 'Utilisateur Web3',
                        username: 'user_' + Math.random().toString(36).slice(2, 8),
                        wallet: '0x' + Array.from({length: 40}, () => 
                            Math.floor(Math.random() * 16).toString(16)
                        ).join(''),
                        avatar: 'https://i.pravatar.cc/80?img=' + Math.floor(Math.random() * 70),
                        verified: Math.random() > 0.7,
                        followers: Math.floor(Math.random() * 1000),
                        following: Math.floor(Math.random() * 500),
                        posts: 0,
                        sphereBalance: (Math.random() * 10).toFixed(2),
                        diamondsReceived: Math.floor(Math.random() * 500),
                        reputation: Math.floor(Math.random() * 3000),
                        rank: '#' + Math.floor(Math.random() * 1000),
                        joined: new Date().toLocaleDateString('fr-FR'),
                        location: 'Paris, France',
                        bio: 'Passionné par le Web3 🚀'
                    };
                    
                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('authToken', 'simulated_token_' + Date.now());
                    
                    showToast(`Connecté avec succès ! Bienvenue ${user.name} 🎉`, 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }, 1500);
            }

            connectBtn.addEventListener('click', () => handleLogin('wallet'));
            document.getElementById('googleBtn').addEventListener('click', () => handleLogin('google'));
            document.getElementById('emailBtn').addEventListener('click', () => handleLogin('email'));
            document.getElementById('qrBtn').addEventListener('click', () => {
                showToast('🔍 Fonctionnalité QR Code disponible bientôt', 'info');
            });
            
            showToast('Bienvenue sur OpenSphere ! Connectez-vous pour commencer', 'info');
        });
    </script>
</body>
</html>
